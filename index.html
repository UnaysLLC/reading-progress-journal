<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="A private reading progress journal that works in your browser."><title>Reading Progress Journal</title>
  <style>
    :root{--ink:#26372f;--green:#2d7656;--blue:#31768d;--paper:#f7f7f1;--line:#d6ddd5;--muted:#69756f;--yellow:#e4ba43}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,sans-serif}.shell{width:min(1080px,calc(100% - 28px));margin:auto;padding:32px 0 70px}header{padding:36px 0}h1{max-width:760px;margin:0;font-size:clamp(2.3rem,7vw,5.2rem);line-height:1;letter-spacing:0}header p{max-width:620px;color:var(--muted);font-size:1.05rem}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.stat{padding:18px;border:1px solid var(--line);border-radius:8px;background:#fff}.stat strong{display:block;font-size:1.8rem}.stat span{color:var(--muted);font-size:.78rem}.layout{display:grid;grid-template-columns:330px 1fr;gap:16px}.panel{padding:20px;border:1px solid var(--line);border-radius:8px;background:#fff}h2{margin-top:0;font-size:1.1rem}label{display:block;margin:13px 0 6px;font-size:.78rem;font-weight:800}input,textarea{width:100%;border:1px solid #bdc9c0;border-radius:6px;font:inherit}input{height:43px;padding:0 10px}textarea{min-height:90px;padding:10px;resize:vertical}.split{display:grid;grid-template-columns:1fr 1fr;gap:9px}button{min-height:42px;padding:0 13px;border:1px solid var(--green);border-radius:6px;background:#fff;color:var(--green);font-weight:800;cursor:pointer}.primary{width:100%;margin-top:16px;background:var(--green);color:#fff}.books{display:grid;gap:10px}.book{padding:17px;border:1px solid var(--line);border-radius:7px;background:#fff}.book-head{display:flex;justify-content:space-between;gap:12px}.book h3{margin:0;font-size:1rem}.author,.reflection{margin:4px 0;color:var(--muted)}.reflection{font-size:.86rem}.bar{height:8px;margin:14px 0 7px;border-radius:4px;background:#e4eae5;overflow:hidden}.bar span{display:block;height:100%;background:var(--blue)}.book-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.76rem}.book-actions{display:flex;gap:7px;margin-top:13px}.book-actions button:last-child{border-color:#ad6657;color:#8a4539}.empty{padding:70px 20px;text-align:center;color:var(--muted)}.top-actions{display:flex;justify-content:flex-end;margin-bottom:10px}@media(max-width:760px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.panel{padding:17px}}
  </style>
</head>
<body><main class="shell"><header><strong>Private reading tool</strong><h1>Keep a record of what you read.</h1><p>Track books and reflections without creating an account. Everything stays in this browser until you export it.</p></header><section class="stats" aria-label="Reading statistics"><div class="stat"><strong id="book-count">0</strong><span>books</span></div><div class="stat"><strong id="page-count">0</strong><span>pages read</span></div><div class="stat"><strong id="finished-count">0</strong><span>finished</span></div></section><div class="layout"><section class="panel"><h2>Add or update a book</h2><form id="form"><input type="hidden" id="editing"><label for="title">Book title</label><input id="title" maxlength="120" required><label for="author">Author</label><input id="author" maxlength="100"><div class="split"><div><label for="current">Current page</label><input id="current" type="number" min="0" value="0"></div><div><label for="total">Total pages</label><input id="total" type="number" min="1" required></div></div><label for="reflection">Short reflection</label><textarea id="reflection" maxlength="500" placeholder="What stood out?"></textarea><button class="primary">Save book</button></form></section><section><div class="top-actions"><button id="export">Export journal</button></div><div class="books" id="books"></div></section></div></main>
<script>
 const KEY='reading-progress-journal-v1',$=s=>document.querySelector(s);let books=JSON.parse(localStorage.getItem(KEY)||'[]');
 function store(){localStorage.setItem(KEY,JSON.stringify(books))}
 function render(){const list=$('#books');list.innerHTML='';books.forEach(book=>{const pct=Math.min(100,Math.round(book.current/book.total*100));const article=document.createElement('article');article.className='book';article.innerHTML='<div class="book-head"><div><h3></h3><p class="author"></p></div><strong class="percent"></strong></div><div class="bar" aria-hidden="true"><span></span></div><div class="book-meta"><span class="pages"></span><span class="state"></span></div><p class="reflection"></p><div class="book-actions"><button>Edit</button><button>Remove</button></div>';article.querySelector('h3').textContent=book.title;article.querySelector('.author').textContent=book.author||'Author not recorded';article.querySelector('.percent').textContent=pct+'%';article.querySelector('.bar span').style.width=pct+'%';article.querySelector('.pages').textContent=book.current+' of '+book.total+' pages';article.querySelector('.state').textContent=pct===100?'Finished':'In progress';const note=article.querySelector('.reflection');note.textContent=book.reflection;note.hidden=!book.reflection;const buttons=article.querySelectorAll('button');buttons[0].onclick=()=>edit(book.id);buttons[1].onclick=()=>{if(confirm('Remove this book?')){books=books.filter(x=>x.id!==book.id);store();render()}};list.append(article)});if(!books.length)list.innerHTML='<div class="panel empty">Your reading list is empty.</div>';$('#book-count').textContent=books.length;$('#page-count').textContent=books.reduce((n,b)=>n+b.current,0);$('#finished-count').textContent=books.filter(b=>b.current>=b.total).length}
 function edit(id){const b=books.find(x=>x.id===id);for(const key of ['title','author','current','total','reflection'])$('#'+key).value=b[key];$('#editing').value=id;$('#title').focus();scrollTo({top:document.querySelector('.layout').offsetTop-20,behavior:'smooth'})}
 $('#form').onsubmit=e=>{e.preventDefault();const current=Math.max(0,Number($('#current').value)),total=Math.max(1,Number($('#total').value));const item={id:$('#editing').value||String(Date.now()),title:$('#title').value.trim(),author:$('#author').value.trim(),current:Math.min(current,total),total,reflection:$('#reflection').value.trim()};const index=books.findIndex(x=>x.id===item.id);if(index>=0)books[index]=item;else books.unshift(item);store();e.target.reset();$('#editing').value='';$('#current').value=0;render()};
 $('#export').onclick=()=>{const blob=new Blob([JSON.stringify({format:'reading-progress-journal',version:1,books},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='reading-journal.json';a.click();URL.revokeObjectURL(a.href)};render();
</script></body></html>
